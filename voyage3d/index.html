<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바르셀로나 정박 크루즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bar:#f4f1ea; --bar-line:#dcd6ca; --ink:#2b2824; --muted:#857d70;
  --chip:#fffdf8; --chip-line:#d6cfc1; --on:#2e3a33; --on-ink:#f4f1ea; --accent:#b3121d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bar:#1f2124;--bar-line:#33363a;--ink:#ece8e0;--muted:#9a958c;--chip:#2a2d31;--chip-line:#3d4146;--on:#e9e4d8;--on-ink:#1f2124}
}
:root[data-theme="dark"]{--bar:#1f2124;--bar-line:#33363a;--ink:#ece8e0;--muted:#9a958c;--chip:#2a2d31;--chip-line:#3d4146;--on:#e9e4d8;--on-ink:#1f2124}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b1d20;color:var(--ink);font:13px/1.4 "Noto Sans KR",system-ui,sans-serif;overflow:hidden}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
header,footer{background:var(--bar);border-color:var(--bar-line);z-index:2}
header{border-bottom:1px solid var(--bar-line);display:flex;align-items:center;gap:12px;padding:10px 16px}
footer{border-top:1px solid var(--bar-line);display:flex;align-items:center;gap:8px;padding:8px 16px}
h1{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sub{color:var(--muted);font-size:12px;padding-left:10px;border-left:1px solid var(--bar-line);white-space:nowrap}
.spacer{flex:1}
.row{display:flex;gap:6px;align-items:center}
button,.select,.full-link{appearance:none;border:1px solid var(--chip-line);background:var(--chip);color:var(--ink);
  font:inherit;font-size:12px;height:30px;padding:0 12px;border-radius:6px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
button:hover{border-color:#b9b0a0}
button[aria-pressed="true"]{background:var(--on);color:var(--on-ink);border-color:var(--on)}
button[aria-pressed="true"]::before{content:"";width:6px;height:6px;border-radius:50%;background:#7fe0a4}
.dropup{position:relative}
.menu{position:absolute;bottom:38px;left:0;background:var(--chip);border:1px solid var(--chip-line);border-radius:8px;
  padding:4px;min-width:150px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu.open{display:block}
.menu button{width:100%;border:0;justify-content:flex-start;background:transparent}
.menu button:hover{background:#efe9dd}
.menu button[aria-pressed="true"]{background:var(--on)}
.caret{font-size:9px;opacity:.6}
.hint{color:var(--muted);font-size:11px;white-space:nowrap}
#stage{position:relative;overflow:hidden;background:#c9d4d8}
canvas{display:block;width:100%;height:100%;touch-action:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#3b4a50;font-size:13px;background:#c9d4d8;transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(15,16,18,.82);display:none;place-items:center;z-index:10;padding:16px}
.modal.open{display:grid}
.modal figure{max-width:min(1100px,100%);background:var(--bar);border-radius:10px;overflow:hidden}
.modal img{display:block;width:100%;height:auto}
.modal figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:rgba(244,241,234,.95);border:1px solid var(--bar-line);
  border-radius:20px;padding:6px 14px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
/* embed mode (?embed=1): used inside the houseofdreams home page */
.embed header h1,.embed header .sub,.embed #btnRender,.embed .hint{display:none}
.embed header{padding:8px 16px}
.full-link{display:none !important;text-decoration:none}
.embed .full-link{display:inline-flex !important}
#touchGate{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding:0 0 18px;height:auto;border-radius:0;z-index:3;background:transparent;border:0;cursor:pointer}
#touchGate span{background:rgba(244,241,234,.95);border:1px solid var(--bar-line);border-radius:20px;padding:7px 14px;font-size:12px;color:var(--ink)}
.embed.coarse #touchGate{display:flex}
.embed.coarse.live #touchGate{display:none}
@media (max-width:820px){
  header{flex-wrap:wrap;gap:8px;padding:10px 16px}
  header .spacer{display:none}
  header .row{width:100%;overflow-x:auto;scrollbar-width:none}
  footer{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
  header .row::-webkit-scrollbar,footer::-webkit-scrollbar{display:none}
  .hint{display:none}
  .menu{position:fixed;bottom:56px;left:16px;right:16px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>바르셀로나 정박 크루즈</h1><span class="sub">Port Vell · 늦은 오후</span>
    <div class="spacer"></div>
    <div class="row">
      <button id="btnLights" aria-pressed="false">선실 불 켜기</button>
      <button id="btnSail" aria-pressed="false">출항하기</button>
      <button id="btnHorn">뱃고동</button>
      <button id="btnRender">Blender 원본 렌더</button>
    </div>
  </header>
  <main id="stage">
    <div id="loading">배를 항구에 대는 중…</div>
    <div class="toast" id="toast"></div>
    <button id="touchGate" aria-label="3D 둘러보기 시작"><span>탭해서 둘러보기</span></button>
  </main>
  <footer>
    <div class="row" id="views">
      <button data-view="harbor" aria-pressed="true">항구 전체</button>
      <button data-view="promenade">야자수 산책로</button>
      <button data-view="sea">바다에서 보기</button>
      <button data-view="bow">뱃머리 근접</button>
      <button data-view="deck">풀 데크 위</button>
    </div>
    <button id="btnWaves" aria-pressed="false">파도 강하게</button>
    <div class="dropup">
      <button id="btnTheme">조명 테마 <span class="caret">▲</span></button>
      <div class="menu" id="themeMenu">
        <button data-theme="afternoon" aria-pressed="true">늦은 오후</button>
        <button data-theme="sunset">지중해 노을</button>
        <button data-theme="night">항구의 밤</button>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="hint">드래그로 둘러보기 · 휠로 확대 · 배를 누르면 뱃고동</span>
    <a class="full-link" href="./" target="_top">크게 보기 ↗</a>
  </footer>
</div>

<div class="modal" id="modal">
  <figure>
    <img id="modalImg" src="blender_render.jpg" alt="Blender 원본 렌더">
    <figcaption>
      <div class="tabs">
        <button data-src="blender_render.jpg" aria-pressed="true">Blender 렌더</button>
        <button data-src="reference.jpg" aria-pressed="false">ComfyUI 참조 이미지</button>
      </div>
      <button id="modalClose">닫기</button>
    </figcaption>
  </figure>
</div>

<script>
  // Opened by double-click (file://): browsers block fetching local files, so load the bundled assets instead.
  if (location.protocol === 'file:') document.write('<script src="offline_assets.js"><\/script>');
  // set the embed class before first paint so the full-page title never flashes inside the home page
  if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
</script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Water } from 'three/addons/objects/Water.js';

const OFF = window.CRUISE_OFFLINE;
const asset = url => (OFF && OFF[url]) || url;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color(0xc4d2d6);
scene.background = BG.clone();
scene.fog = new THREE.Fog(0xc9d3d3, 260, 1400);

const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 25; controls.maxDistance = 420;

// Embedded in another page: on touch screens keep page scrolling until the visitor taps to explore.
const EMBED = new URLSearchParams(location.search).has('embed');
const COARSE = matchMedia('(pointer: coarse)').matches;
if (EMBED) document.documentElement.classList.add('embed');
if (EMBED && COARSE) {
  document.documentElement.classList.add('coarse');
  controls.enabled = false;
  renderer.domElement.style.touchAction = 'pan-y';
  document.getElementById('touchGate').onclick = () => {
    controls.enabled = true; renderer.domElement.style.touchAction = 'none';
    document.documentElement.classList.add('live');
  };
}

// ---- lights
const hemi = new THREE.HemisphereLight(0xdbe8f0, 0x2c4a50, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffdcb0, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 60, bottom: -60, near: 10, far: 500 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// ---- water
const waterNormals = new THREE.TextureLoader().load(asset('waternormals.jpg'), t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; });
const water = new Water(new THREE.PlaneGeometry(5000, 5000), {
  textureWidth: 1024, textureHeight: 1024, waterNormals,
  sunDirection: new THREE.Vector3(), sunColor: 0xffe2c0, waterColor: 0x0d4b56,
  distortionScale: 2.2, fog: true
});
water.rotation.x = -Math.PI / 2;
scene.add(water);

// ---- Barcelona backdrop (ComfyUI)
const backdropMat = new THREE.MeshBasicMaterial({ fog: false, transparent: true, depthWrite: false });
const bdImg = new Image();
bdImg.onload = () => {
  // fade the left/right/top edges so the photo melts into the sky colour
  const c = document.createElement('canvas'); c.width = bdImg.width; c.height = bdImg.height;
  const g = c.getContext('2d'); g.drawImage(bdImg, 0, 0);
  g.globalCompositeOperation = 'destination-in';
  const h = g.createLinearGradient(0, 0, c.width, 0);
  h.addColorStop(0, 'rgba(0,0,0,0)'); h.addColorStop(0.16, '#000'); h.addColorStop(0.84, '#000'); h.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = h; g.fillRect(0, 0, c.width, c.height);
  const v = g.createLinearGradient(0, 0, 0, c.height);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(0.35, '#000'); v.addColorStop(1, '#000');
  g.fillStyle = v; g.fillRect(0, 0, c.width, c.height);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  backdropMat.map = t; backdropMat.needsUpdate = true;
};
bdImg.src = asset('backdrop.jpg');
const BW = 2400, BH = BW / 2.379;
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(BW, BH), backdropMat);
backdrop.position.set(0,BH / 2 - BH * 0.043 - 4, -1600);
backdrop.layers.set(1);           // seen by the main camera only, not mirrored by the water
camera.layers.enable(1);
scene.add(backdrop);

// ---- window textures (canvas)
function bandTexture(kind, lit, seedBase = 1) {
  const c = document.createElement('canvas'); c.width = 2048; c.height = (kind === 'port' || kind === 'prom') ? 32 : 64;
  const g = c.getContext('2d');
  const W = c.width, H = c.height;
  let seed = kind.length * 97 + seedBase * 7919;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  if (kind === 'port') {
    // grouped round portholes on the white hull
    g.fillStyle = lit ? '#000' : '#e0e2e3'; g.fillRect(0, 0, W, H);
    let x = 10;
    while (x < W - 20) {
      const n = 2 + Math.floor(rnd() * 4);
      for (let i = 0; i < n && x < W - 20; i++, x += 22) {
        const on = rnd() < 0.5;
        g.fillStyle = lit ? (on ? '#ffcf8a' : '#000') : '#1b252b';
        g.beginPath(); g.arc(x, H / 2, 7, 0, Math.PI * 2); g.fill();
      }
      x += 30 + rnd() * 60;
    }
  } else if (kind === 'prom') {
    g.fillStyle = lit ? '#000' : '#e0e2e3'; g.fillRect(0, 0, W, H);
    for (let x = 8; x < W - 24; x += 26) {
      if (rnd() < 0.25) continue;
      g.fillStyle = lit ? (rnd() < 0.7 ? '#ffd79a' : '#000') : '#151c21';
      g.fillRect(x, 7, 18, H - 14);
    }
  } else {
    g.fillStyle = lit ? '#000' : '#141a1e'; g.fillRect(0, 0, W, H);
    const step = kind === 'balcony' ? 22 : 12;
    for (let x = 0; x < W; x += step) {
      const on = rnd() < (kind === 'balcony' ? 0.45 : 0.7);
      if (lit) {
        if (on) { g.fillStyle = rnd() < .3 ? '#ffe6b8' : '#ffbe73'; g.fillRect(x + 2, 6, step - 4, H - 22); }
      } else {
        const grad = g.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#2c3a42'); grad.addColorStop(1, '#0c1114');
        g.fillStyle = grad; g.fillRect(x + 1, 2, step - 2, H - 4);
        g.fillStyle = 'rgba(190,210,220,.18)'; g.fillRect(x + 1, 2, step - 2, 6);
      }
      if (kind === 'balcony') { g.fillStyle = lit ? '#000' : '#9aa1a6'; g.fillRect(x, 0, 3, H); }
    }
    if (kind === 'balcony' && !lit) {
      // glass balustrade + handrail across the lower part of each balcony
      g.fillStyle = 'rgba(150,170,180,.35)'; g.fillRect(0, H - 26, W, 24);
      g.fillStyle = '#c9cdd0'; g.fillRect(0, H - 27, W, 2);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const winMats = [], winCache = {};
function windowMaterial(name) {
  const kind = name.startsWith('Win_port') ? 'port' : name.startsWith('Win_prom') ? 'prom'
             : name.startsWith('Win_balc') ? 'balcony' : 'upper';
  const variant = kind === 'balcony' ? (parseInt(name.slice(-1)) || 0) % 3 : 0;   // 3 lit patterns so decks don't repeat
  const key = kind + variant;
  if (winCache[key]) return winCache[key];
  const matte = kind === 'port' || kind === 'prom';
  const m = new THREE.MeshStandardMaterial({
    map: bandTexture(kind, false, variant + 1), emissiveMap: bandTexture(kind, true, variant + 1),
    side: THREE.DoubleSide, emissive: 0xffffff, emissiveIntensity: 0, roughness: matte ? 0.4 : 0.15, metalness: matte ? 0 : 0.35
  });
  winMats.push(m); winCache[key] = m; return m;
}

// ---- model
let ship, port, lampMat; const shipMeshes = [];
const deckLights = new THREE.Group();
// The model ships as a JSON scene + base64 text buffer (only text/json files are served),
// reassembled here into a GLB in memory so no data:/blob: URL has to be fetched.
async function loadModel() {
  const [sceneText, b64] = OFF ? [OFF.scene, OFF.bin] : await Promise.all([
    fetch('cruise_scene.json').then(r => { if (!r.ok) throw new Error('scene ' + r.status); return r.text(); }),
    fetch('cruise_bin.txt').then(r => { if (!r.ok) throw new Error('bin ' + r.status); return r.text(); }),
  ]);
  const raw = atob(b64.trim()); const bin = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
  const enc = new TextEncoder().encode(sceneText);
  const jsonLen = Math.ceil(enc.length / 4) * 4, binLen = Math.ceil(bin.length / 4) * 4;
  const total = 12 + 8 + jsonLen + 8 + binLen;
  const glb = new ArrayBuffer(total), dv = new DataView(glb), u8 = new Uint8Array(glb);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, total, true);
  dv.setUint32(12, jsonLen, true); dv.setUint32(16, 0x4E4F534A, true);
  u8.fill(0x20, 20, 20 + jsonLen); u8.set(enc, 20);
  const o = 20 + jsonLen;
  dv.setUint32(o, binLen, true); dv.setUint32(o + 4, 0x004E4942, true); u8.set(bin, o + 8);
  return new Promise((res, rej) => new GLTFLoader().parse(glb, '', res, rej));
}
loadModel().then(gltf => {
  const root = gltf.scene;
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    if (o.name.startsWith('Win_')) o.material = windowMaterial(o.name);
    const mn = o.material && o.material.name;
    if (mn === 'palm_frond' || mn === 'pine_green') o.material.side = THREE.DoubleSide;
    if (mn === 'palm_frond' || mn === 'palm_trunk' || mn === 'pine_green') o.castShadow = false; // keep the shadow map for the ship
    if (o.name.startsWith('Lamp_head') && !lampMat) {
      lampMat = o.material.clone(); lampMat.emissive = new THREE.Color(0xffc977); lampMat.emissiveIntensity = 0;
    }
    if (o.name.startsWith('Lamp_head')) o.material = lampMat;
  });
  scene.add(root);
  ship = root.getObjectByName('Ship');
  port = root.getObjectByName('Port');
  ship.traverse(o => o.isMesh && shipMeshes.push(o));
  // deck string lights for night
  for (let i = 0; i < 30; i++) for (const z of [-4.6, 4.6]) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffd38a }));
    b.position.set(-2 + i * 0.95, 17.6, z); deckLights.add(b);
  }
  deckLights.visible = false; ship.add(deckLights);
  shipHome.copy(ship.position);
  document.getElementById('loading').classList.add('done');
}).catch(e => { document.getElementById('loading').textContent = '모델을 불러오지 못했어요 (' + (e && e.message || e) + ')'; console.error(e); });

// ---- themes
const THEMES = {
  afternoon: { sunPos: [-120, 70, 150], sun: 0xffdcb0, sunI: 2.6, hemi: 0.9, bg: 0xc4d2d6, fog: 0xc9d3d3, tint: 0xffffff, water: 0x0d4b56, exp: 1.0, lights: false },
  sunset:    { sunPos: [-260, 26, 60],  sun: 0xff9a5a, sunI: 2.4, hemi: 0.55, bg: 0xe4a77f, fog: 0xd59a7c, tint: 0xffb18a, water: 0x1d3f4a, exp: 1.05, lights: false },
  night:     { sunPos: [140, 120, 120], sun: 0x8fa8d8, sunI: 0.35, hemi: 0.18, bg: 0x0f1626, fog: 0x0f1626, tint: 0x2a3150, water: 0x031a22, exp: 1.1, lights: true },
};
let theme = 'afternoon';
const tween = { t: 1, from: null, to: null };
function themeState(name) {
  const T = THEMES[name];
  return { sunPos: new THREE.Vector3(...T.sunPos), sun: new THREE.Color(T.sun), sunI: T.sunI, hemi: T.hemi,
    bg: new THREE.Color(T.bg), fog: new THREE.Color(T.fog), tint: new THREE.Color(T.tint), water: new THREE.Color(T.water), exp: T.exp };
}
let cur = themeState('afternoon');
function applyTheme(s) {
  sun.position.copy(s.sunPos); sun.color.copy(s.sun); sun.intensity = s.sunI; hemi.intensity = s.hemi;
  scene.background.copy(s.bg); scene.fog.color.copy(s.fog); backdropMat.color.copy(s.tint);
  water.material.uniforms.waterColor.value.copy(s.water);
  water.material.uniforms.sunColor.value.copy(s.sun);
  water.material.uniforms.sunDirection.value.copy(s.sunPos).normalize();
  renderer.toneMappingExposure = s.exp;
}
function setTheme(name) {
  theme = name; tween.from = { ...cur, sunPos: cur.sunPos.clone(), sun: cur.sun.clone(), bg: cur.bg.clone(), fog: cur.fog.clone(), tint: cur.tint.clone(), water: cur.water.clone() };
  tween.to = themeState(name); tween.t = 0;
  document.querySelectorAll('#themeMenu button').forEach(b => b.setAttribute('aria-pressed', b.dataset.theme === name));
  setLights(THEMES[name].lights);
  document.querySelector('.sub').textContent = 'Port Vell · ' + { afternoon: '늦은 오후', sunset: '지중해 노을', night: '항구의 밤' }[name];
}
applyTheme(cur);

// ---- cabin lights
let lightsOn = false;
const btnLights = document.getElementById('btnLights');
function setLights(on) {
  lightsOn = on; btnLights.setAttribute('aria-pressed', on);
  btnLights.textContent = on ? '선실 불 끄기' : '선실 불 켜기';
  deckLights.visible = on;
}
btnLights.onclick = () => setLights(!lightsOn);

// ---- camera views
const VIEWS = {
  harbor: { pos: [45, 52, 205], target: [-12, 6, 0] },
  promenade: { pos: [-110, 4.2, 48], target: [-20, 11, -2] },
  sea:    { pos: [-20, 4, 95],  target: [0, 10, 0] },
  bow:    { pos: [72, 10, 34],  target: [36, 6, 0] },
  deck:   { pos: [-46, 27, 16], target: [4, 17.5, 0] },
};
const camTween = { t: 1, p0: new THREE.Vector3(), p1: new THREE.Vector3(), q0: new THREE.Vector3(), q1: new THREE.Vector3() };
function goView(name, instant) {
  const v = VIEWS[name];
  camTween.p0.copy(camera.position); camTween.q0.copy(controls.target);
  camTween.p1.set(...v.pos); camTween.q1.set(...v.target);
  if (camera.aspect < 1.4) {  // portrait / square frames: step back so the whole ship fits
    const k = camera.aspect < 0.9 ? (name === 'deck' ? 1.35 : 1.6) : (name === 'deck' ? 1.15 : 1.3);
    camTween.p1.sub(camTween.q1).multiplyScalar(k).add(camTween.q1);
    if (name === 'harbor' || name === 'sea') camTween.q1.x += 10;
  }
  if (ship) { camTween.p1.add(ship.position); camTween.q1.add(ship.position); }
  camTween.t = instant ? 1 : 0;
  if (instant) { camera.position.copy(camTween.p1); controls.target.copy(camTween.q1); }
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === name));
}
document.querySelectorAll('#views button').forEach(b => b.onclick = () => goView(b.dataset.view));
goView('harbor', true);
controls.addEventListener('start', () => { camTween.t = 1; });

// ---- waves
let rough = false;
const btnWaves = document.getElementById('btnWaves');
btnWaves.onclick = () => { rough = !rough; btnWaves.setAttribute('aria-pressed', rough); };

// ---- theme menu
const menu = document.getElementById('themeMenu');
document.getElementById('btnTheme').onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); };
menu.querySelectorAll('button').forEach(b => b.onclick = () => { setTheme(b.dataset.theme); menu.classList.remove('open'); });
document.addEventListener('click', () => menu.classList.remove('open'));

// ---- horn (Web Audio)
let actx;
function horn() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const t = actx.currentTime, out = actx.createGain();
  out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.28, t + 0.25);
  out.gain.setValueAtTime(0.28, t + 1.6); out.gain.linearRampToValueAtTime(0, t + 2.3);
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  out.connect(lp).connect(actx.destination);
  [87, 87.6, 130.5, 174].forEach((f, i) => {
    const o = actx.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'triangle'; o.frequency.value = f;
    const g = actx.createGain(); g.gain.value = i < 2 ? 0.5 : 0.25; o.connect(g).connect(out); o.start(t); o.stop(t + 2.4);
  });
  toast('뿌우——');
}
document.getElementById('btnHorn').onclick = horn;

// ---- departure
const shipHome = new THREE.Vector3();
let sailing = false, sailT = 0;
const btnSail = document.getElementById('btnSail');
btnSail.onclick = () => {
  sailing = !sailing; btnSail.setAttribute('aria-pressed', sailing);
  btnSail.textContent = sailing ? '다시 정박하기' : '출항하기';
  if (sailing) { horn(); toast('출항! 다음 항구로'); }
};

// ---- render modal
const modal = document.getElementById('modal'), modalImg = document.getElementById('modalImg');
document.getElementById('btnRender').onclick = () => modal.classList.add('open');
document.getElementById('modalClose').onclick = () => modal.classList.remove('open');
modal.onclick = e => { if (e.target === modal) modal.classList.remove('open'); };
modal.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  modalImg.src = b.dataset.src;
  modal.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
});
addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

// ---- click ship -> horn
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5 || !ship) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.intersectObjects(shipMeshes, false).length) horn();
});

// ---- toast
let toastTimer; const toastEl = document.getElementById('toast');
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600); }

// ---- resize
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 0.9 ? 55 : 38;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();
goView('harbor', true);

// ---- loop
const clock = new THREE.Clock(); const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const lerpC = (a, b, t) => a.clone().lerp(b, t);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  water.material.uniforms.time.value += dt * (rough ? 1.4 : 0.5);
  water.material.uniforms.distortionScale.value += ((rough ? 6.5 : 2.2) - water.material.uniforms.distortionScale.value) * 0.05;

  if (tween.t < 1) {
    tween.t = Math.min(1, tween.t + dt / 1.4); const k = ease(tween.t), a = tween.from, b = tween.to;
    cur = { sunPos: a.sunPos.clone().lerp(b.sunPos, k), sun: lerpC(a.sun, b.sun, k), sunI: a.sunI + (b.sunI - a.sunI) * k,
      hemi: a.hemi + (b.hemi - a.hemi) * k, bg: lerpC(a.bg, b.bg, k), fog: lerpC(a.fog, b.fog, k), tint: lerpC(a.tint, b.tint, k),
      water: lerpC(a.water, b.water, k), exp: a.exp + (b.exp - a.exp) * k };
    applyTheme(cur);
  }
  const target = lightsOn ? 1.6 : 0;
  winMats.forEach(m => m.emissiveIntensity += (target - m.emissiveIntensity) * 0.08);
  if (lampMat) lampMat.emissiveIntensity += ((theme === 'night' ? 3 : 0) - lampMat.emissiveIntensity) * 0.08;

  if (ship) {
    // departure: slide away from pier then head out to sea
    sailT += ((sailing ? 1 : 0) - sailT) * 0;
    if (sailing) sailT = Math.min(1, sailT + dt / 22); else sailT = Math.max(0, sailT - dt / 8);
    const s = ease(sailT);
    ship.position.set(shipHome.x + s * 260, shipHome.y, shipHome.z + Math.min(1, sailT * 3) * 18 + s * 40);
    ship.rotation.y = -s * 0.25;
    const sway = rough ? 1 : 0.35;
    ship.rotation.z = Math.sin(time * 0.6) * 0.006 * sway;
    ship.rotation.x = Math.sin(time * 0.45 + 1) * 0.004 * sway;
    ship.position.y = shipHome.y + Math.sin(time * 0.5) * 0.12 * sway;
    sun.target.position.copy(ship.position); sun.position.copy(cur.sunPos).add(ship.position);
    deckLights.children.forEach((b, i) => b.material.color.setHSL(0.1, 1, 0.55 + 0.15 * Math.sin(time * 2 + i)));
  }
  if (camTween.t < 1) {
    camTween.t = Math.min(1, camTween.t + dt / 1.6); const k = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, k); controls.target.lerpVectors(camTween.q0, camTween.q1, k);
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
